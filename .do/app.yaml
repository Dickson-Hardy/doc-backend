name: cmda-conference-api
region: nyc

services:
  - name: api
    github:
      repo: Dickson-Hardy/doc-backend
      branch: master
      deploy_on_push: true
    build_command: pnpm install --frozen-lockfile && pnpm run build
    run_command: node dist/main.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_HOST
        value: aws-1-us-east-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_USER
        type: SECRET
      - key: DATABASE_PASSWORD
        type: SECRET
      - key: DATABASE_NAME
        value: postgres
      - key: MONGODB_URI
        type: SECRET
      - key: CORS_ORIGINS
        value: https://dnconference.cmdanigeria.net,https://www.dnconference.cmdanigeria.net,https://cmdanigeria.org
      - key: PAYSTACK_SECRET_KEY
        type: SECRET
      - key: PAYSTACK_PUBLIC_KEY
        type: SECRET
      - key: FRONTEND_URL
        value: https://dnconference.cmdanigeria.net
      - key: SMTP_PASS
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
    routes:
      - path: /
